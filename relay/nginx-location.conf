# Keyweave mailbox relay: nginx location snippet.
# Include inside your EXISTING TLS server block for the relay host, e.g.:
#   include /etc/nginx/snippets/keyweave-relay.conf;
# The relay itself binds 127.0.0.1:8151 and is never reachable directly.
#
# REQUIRES the two shared-memory zones below at http{} scope (install them as
# /etc/nginx/conf.d/keyweave-ratelimit.conf). Without them `nginx -t` fails
# closed, which is intended:
#   limit_req_zone  $binary_remote_addr zone=keyweave_req:1m  rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=keyweave_conn:1m;
#
# ---------------------------------------------------------------------------
# CLIENT-ADDRESS COHERENCE (load-bearing for the failure budget + fail2ban)
# ---------------------------------------------------------------------------
# The relay binds loopback only, so the TCP peer of the nginx->relay hop is
# ALWAYS 127.0.0.1. Without the config below EVERY request is attributed to that
# proxy peer: the relay's per-(source,mailbox) failure budget cannot tell
# clients apart, and any AUTHFAIL line handed to fail2ban would ban 127.0.0.1
# itself = total outage. The relay logs a loud STARTUP warning while
# trust_forwarded_for=0.
#
# THE ONE COHERENT REMEDY -- relay `trust_forwarded_for = 1` in relay.conf AND
# nginx OVERWRITES X-Forwarded-For with the peer it actually saw:
#       proxy_set_header X-Forwarded-For $remote_addr;
# The overwrite is load-bearing: never $proxy_add_x_forwarded_for, which APPENDS
# a client-supplied value that an attacker could make the last (trusted) hop.
# The relay reads the LAST hop -- the only entry a remote client cannot choose.
# When nginx is the edge, $remote_addr IS the real client, so this alone is
# enough.
#
# WHY NOT nginx realip (real_ip_header X-Forwarded-For; set_real_ip_from ...):
# realip rewrites nginx's OWN $remote_addr / $binary_remote_addr variables. It
# does NOT change the TCP peer of the nginx->relay connection, so with the relay
# on trust_forwarded_for=0 the relay STILL sees 127.0.0.1 -- realip alone never
# reaches the relay. realip has exactly one role here, and it is a PREREQUISITE
# to the remedy above, not an alternative: if nginx itself sits behind ANOTHER
# trusted proxy/load balancer, use realip to make nginx's $remote_addr the true
# client FIRST, then the same `proxy_set_header X-Forwarded-For $remote_addr;`
# forwards that true client to the relay.
#
location /v1/ {
    proxy_pass http://127.0.0.1:8151;

    # Hand the relay the REAL client address. Pair with trust_forwarded_for=1 in
    # relay.conf. OVERWRITE (never append) so a client-supplied XFF cannot spoof
    # the last hop the relay trusts.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Per-IP flood walls in FRONT of the relay. The relay's own disk-persisted
    # budgets still apply behind these; neither layer assumes the other.
    limit_req  zone=keyweave_req  burst=20 nodelay;
    # Keep limit_conn aligned with the relay's listen backlog
    # (request_queue_size=128): the connection ceiling should stay well under it
    # so a burst is shaped here, not dropped as ECONNRESET at the relay socket.
    limit_conn keyweave_conn 16;

    # Defense in depth: the relay enforces its own 64 KiB raw cap (413); nginx
    # refuses even earlier so oversize bodies never reach it. Keep >= the relay's
    # max_blob_bytes + protocol slack.
    client_max_body_size 128k;

    # The browser client is served from a DISTINCT trust domain (spec R2), so
    # its cross-origin preflight (OPTIONS) must reach the relay -- the relay
    # answers CORS itself from its allowed_origins allowlist. Do not short-
    # circuit OPTIONS here.

    access_log off;
    # error_log records the full request line incl. the mailbox id even with
    # access_log off; keep it at crit or route it somewhere access-controlled
    # and short-lived.
    error_log /var/log/nginx/keyweave_error.log crit;
}
